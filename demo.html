<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherMind - TradingView Demo</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Base Styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Demo App Specific Styles -->
    <link rel="stylesheet" href="demo.css">
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="demo-app">

    <!-- Top Navigation -->
    <header class="app-header">
        <div class="nav-logo">
            <div class="logo-icon">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" stroke="url(#logoGrad)" stroke-width="2" />
                    <path d="M20 6 L26 16 L34 18 L28 24 L29 33 L20 28 L11 33 L12 24 L6 18 L14 16 Z" fill="url(#logoGrad)" opacity="0.8" />
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#6366f1" />
                            <stop offset="50%" stop-color="#a855f7" />
                            <stop offset="100%" stop-color="#06b6d4" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <span class="logo-text">AetherMind <span class="badge">PRO</span></span>
        </div>
        <div class="header-controls">
            <button id="toggleAiBtn" class="btn btn-outline btn-sm">
                <span class="ai-status-dot"></span>
                <span>Toggle AI Overlays</span>
            </button>
            <a href="en.html" class="btn btn-outline btn-sm">Back to Home</a>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="app-workspace">
        
        <!-- Left Panel: Options Scanner -->
        <aside class="panel left-panel">
            <div class="panel-header">
                <h3>Options Scanner</h3>
                <span class="symbol-label">BTC/USDT</span>
            </div>
            <div class="table-container">
                <table class="options-chain">
                    <thead>
                        <tr>
                            <th>Call Bid</th>
                            <th>Call Ask</th>
                            <th>Strike</th>
                            <th>Put Bid</th>
                            <th>Put Ask</th>
                        </tr>
                    </thead>
                    <tbody id="optionsBody">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </aside>

        <!-- Center Panel: Dynamic Chart -->
        <section class="panel center-panel">
            <div class="chart-header">
                <div class="chart-title">
                    <h2 id="currentChartTitle">BTC/USDT - Spot</h2>
                    <span class="live-badge">LIVE</span>
                </div>
                <div class="chart-tools">
                    <span class="tool-item">1D</span>
                    <span class="tool-item active">1H</span>
                    <span class="tool-item">15m</span>
                    <span class="tool-item">1m</span>
                </div>
            </div>
            <!-- The Chart Container -->
            <div id="tvchart" class="chart-container"></div>
            
            <!-- AI Sentiment Info Overlay (Mock) -->
            <div id="aiOverlayInfo" class="ai-overlay-info hidden">
                <div class="overlay-row"><span class="label">AI Confidence:</span> <span class="val green">94.2%</span></div>
                <div class="overlay-row"><span class="label">NLP Sentiment:</span> <span class="val green">Bullish</span></div>
                <div class="overlay-row"><span class="label">Vol Forecast:</span> <span class="val">High</span></div>
            </div>
        </section>

        <!-- Right Panel: Real-time AI Signals -->
        <aside class="panel right-panel">
            <div class="panel-header">
                <h3>AI Signal Feed</h3>
                <span class="signal-count">Live</span>
            </div>
            <div class="signal-feed" id="signalFeed">
                <!-- Populated via JS -->
            </div>
        </aside>

    </main>

    <script src="demo.js"></script>
</body>
</html>
